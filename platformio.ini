[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
build_flags = -DCORE_DEBUG_LEVEL=0

[env:cyd]
build_flags = ${env.build_flags} -DPANEL_INVERT=0

[env:cyd_inv]
build_flags = ${env.build_flags} -DPANEL_INVERT=1

[env:cyd_st7789]
build_flags = ${env.build_flags} -DPANEL_ST7789 -DPANEL_INVERT=0

[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = ai-panel.local

[env:cyd_st7789_ota]
extends = env:cyd_st7789
upload_protocol = espota
upload_port = ai-panel.local
